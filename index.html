<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enuygun Branch Name Generator</title>
  <meta name="description" content="JIRA branch isimlerini kolayca oluşturmak için Enuygun aracı.">

  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicons/favicon-16x16.png">
  <link rel="manifest" href="assets/favicons/site.webmanifest">
  <link rel="mask-icon" href="assets/favicons/safari-pinned-tab.svg" color="#5bbad5">
  <link rel="shortcut icon" href="assets/favicons/favicon.ico">
  <meta name="msapplication-TileColor" content="#00a300">
  <meta name="msapplication-config" content="assets/favicons/browserconfig.xml">
  <meta name="theme-color" content="#1a1f3a">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/foundation/6.4.0/css/foundation.css'>
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.0/animate.min.css'>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <main class="page__wrapper">
    <div data-branch-name-generator data-live-validate="true">
      <div class="content__wrapper">
        <!-- Brand Badge -->
        <div class="brand-badge">Wingie Enuygun</div>
        
        <h1 class="wrapper__title">Branch Name Generator</h1>
        <p class="wrapper__subtitle">JIRA branch isimlerini kolayca oluştur ve kopyala ✨</p>
        
        <!-- form -->
        <form class="grid-container" data-form>
          <div class="grid-x grid-padding-x">
            <!-- Project Type -->
            <div class="cell small-12">
              <label>Tip
                <select name="type">
                  <option value="hotfix">🔧 Hotfix</option>
                  <option value="feature">🚀 Feature</option>
                  <option value="epic">📦 Epic</option>
                  <option value="problem">🐛 Problem</option>
                  <option value="refactor">♻️ Refactor</option>
                  <option value="document_update">📝 Document Update</option>
                  <option value="unittest">🧪 Unit Test</option>
                </select>
              </label>
            </div>
            <!-- Ticket Number -->
            <div class="cell small-12">
              <label>Jira Link
                <input type="text" name="issue" placeholder="https://jira.example.com/browse/PI-1234">
              </label>
            </div>
            <!-- Description -->
            <div class="cell small-12">
              <label>Açıklama
                <input type="text" name="description" aria-describedby="descriptionHelpText" placeholder="fix login button">
              </label>
              <p class="help-text" id="descriptionHelpText">Issue'yu tanımlayan anahtar kelimeler girin</p>
            </div>
          </div>
        </form>
        
        <!-- Output Area/Copy to clipboard button -->
        <div class="output__wrapper animated" data-output-area>

        </div>
      </div>
    </div>
  </main>

  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.22.2/moment.min.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.1/clipboard.min.js'></script>
  <script src="assets/app.js"></script>
</body>
</html>
